name: Deploy

# A merge to main runs the tests, applies infra/ and uploads the frontend.
# AWS access: OIDC role (infra/bootstrap/github.tf), no stored keys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra apply -input=false -auto-approve
      - run: ./scripts/deploy-frontend.sh
